<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="0.6" stop-color="#0b1026"/>
      <stop offset="1" stop-color="#02040a"/>
    </radialGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.55" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g fill="#e0f2fe" opacity="0.8">
    <circle cx="70" cy="90" r="3"/><circle cx="420" cy="70" r="2.5"/><circle cx="460" cy="200" r="2"/>
    <circle cx="60" cy="300" r="2"/><circle cx="110" cy="420" r="2.5"/><circle cx="440" cy="400" r="3"/>
    <circle cx="300" cy="50" r="2"/><circle cx="180" cy="60" r="1.8"/>
  </g>
  <!-- La lettre A -->
  <path d="M256 92 L392 404 L330 404 L304 342 L208 342 L182 404 L120 404 Z M226 296 L286 296 L256 222 Z"
        fill="url(#a)" filter="url(#glow)"/>
  <!-- Impact lumineux au sommet -->
  <circle cx="256" cy="108" r="16" fill="#ffffff" filter="url(#glow)"/>
</svg>
